<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pop Apart!</title>
<style>
:root { --bg: #f4f7fc; --card: #ffffff; --ink: #1b2a41; --muted: #56647a; --accent: #ffc23d; --coral: #ff5446; --line: #dbe3ef; --link: #2f6fd0; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1a33; --card: #15264a; --ink: #e9eef7; --muted: #a9b6cc; --line: #26385f; --link: #8fc0ff; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
header { background: linear-gradient(180deg, #3b7bd0, #112f69); color: #fff; padding: 36px 16px 28px; text-align: center; }
header .logo { font-weight: 900; font-size: 34px; letter-spacing: .5px; }
header .logo .pop { color: #ff8a7a; }
header .logo .apart { color: var(--accent); }
header h1 { margin: 6px 0 0; font-size: 20px; font-weight: 600; opacity: .95; }
main { max-width: 760px; margin: -14px auto 40px; padding: 0 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 22px; }
h2 { font-size: 20px; margin: 28px 0 8px; }
h2:first-of-type { margin-top: 8px; }
p, li { color: var(--ink); }
.muted { color: var(--muted); font-size: 15px; }
.summary { background: rgba(255, 194, 61, .14); border-left: 4px solid var(--accent); border-radius: 10px; padding: 12px 16px; margin: 12px 0 4px; }
a { color: var(--link); }
table { width: 100%; border-collapse: collapse; font-size: 15px; margin: 8px 0; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
footer { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 40px; }
nav { text-align: center; margin: 18px 0 0; }
nav a { margin: 0 10px; }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="pop">POP</span> <span class="apart">APART!</span></div>
  <h1>3D Toy Puzzle</h1>
</header>
<main>
<div class="card">
<p>Tap the pieces in the right order and pop every toy apart: cars, robots, rockets, a vault safe and more,
across 50 levels.</p>
<ul>
  <li><a href="privacy.html">Privacy Policy</a></li>
  <li><a href="terms.html">Terms of Use</a></li>
</ul>
<p>Support: <a href="mailto:truongduytanepu@gmail.com">truongduytanepu@gmail.com</a></p>
</div>
</main>
<footer>© 2026 Tan Truong</footer>
</body>
</html>
